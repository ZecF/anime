<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Poch1 Anime Stream</title>
    
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: white; }
        header { background: #1a1a1a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e50914; }
        header h1 { margin: 0; font-size: 24px; color: #e50914; cursor: pointer; }
        .search-box { display: flex; gap: 10px; }
        .search-box input { padding: 8px 15px; border-radius: 20px; border: 1px solid #333; background: #222; color: white; width: 250px; outline: none; }
        .search-box button { background: #e50914; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .section-title { margin-bottom: 20px; font-size: 20px; border-left: 4px solid #e50914; padding-left: 10px; }
        
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .anime-card { background: #1a1a1a; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .anime-card:hover { transform: scale(1.05); }
        .anime-card img { width: 100%; height: 260px; object-fit: cover; background: #222; }
        .anime-info { padding: 10px; }
        .anime-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .anime-meta { font-size: 11px; color: #aaa; display: flex; justify-content: space-between; }
        
        #player-section { display: none; background: #111; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        
        /* Wadah Video Responsif (Aspek Rasio 16:9) */
        #video-wrapper { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }
        
        .episode-list { display: flex; flex-wrap: wrap; gap: 10px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
        .episode-list::-webkit-scrollbar { width: 6px; }
        .episode-list::-webkit-scrollbar-thumb { background: #e50914; border-radius: 4px; }
        
        .ep-btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .ep-btn:hover, .ep-btn.active { background: #e50914; border-color: #e50914; }
        
        #loading { text-align: center; color: #e50914; font-weight: bold; margin: 20px; display: none; }
        
        /* Kotak Server */
        .server-box { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .server-title { font-size: 12px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <header>
        <h1 onclick="loadHome()">POCH1 ANIME</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari anime favoritmu..." onkeypress="if(event.key==='Enter') searchAnime()">
            <button onclick="searchAnime()">CARI</button>
        </div>
    </header>

    <div class="container">
        <div id="loading">Memuat data dari server... ⏳</div>
        
        <div id="player-section">
            <h2 id="play-title" style="margin-top: 0;">Judul Anime</h2>
            
            <!-- Tempat Video Dimainkan -->
            <div id="video-wrapper"></div>
            
            <!-- Tempat Pilihan Server -->
            <div id="server-list-container"></div>
            
            <div>
                <h3 style="margin-bottom:10px;">Daftar Episode:</h3>
                <div class="episode-list" id="ep-list"></div>
            </div>
        </div>

        <h2 class="section-title" id="grid-title">Lagi Populer Hari Ini</h2>
        <div class="anime-grid" id="animeGrid"></div>
    </div>

    <script>
        const IMG_BASE = "https://xyz-api.animein.net";

        function fixImg(u) {
            if (!u) return "https://via.placeholder.com/200x300?text=No+Image";
            let rawUrl = u.startsWith("http") ? u : IMG_BASE + (u.startsWith("/") ? "" : "/") + u;
            return "https://wsrv.nl/?url=" + encodeURIComponent(rawUrl);
        }

        async function fetchAPI(url) {
            document.getElementById('loading').style.display = 'block';
            try {
                let res = await fetch(url);
                let json = await res.json();
                document.getElementById('loading').style.display = 'none';
                return json.data;
            } catch (err) {
                console.error(err);
                document.getElementById('loading').style.display = 'none';
                return null;
            }
        }

        async function loadHome() {
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('grid-title').innerText = "Lagi Populer Hari Ini";
            document.getElementById('video-wrapper').innerHTML = '';
            
            const data = await fetchAPI('/api/home');
            if (data && data.popular) renderGrid(data.popular);
        }

        async function searchAnime() {
            const keyword = document.getElementById('searchInput').value;
            if(!keyword) return;
            
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('video-wrapper').innerHTML = '';
            document.getElementById('grid-title').innerText = `Hasil Pencarian: "${keyword}"`;
            
            const data = await fetchAPI(`/api/search?keyword=${encodeURIComponent(keyword)}&page=0`);
            if (data && data.movie) {
                renderGrid(data.movie);
            } else {
                document.getElementById('animeGrid').innerHTML = '<div style="color:#aaa;">Tidak ditemukan.</div>';
            }
        }

        function renderGrid(movies) {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = '';
            movies.forEach(m => {
                let card = document.createElement('div');
                card.className = 'anime-card';
                card.onclick = () => loadDetail(m.id, m.title);
                card.innerHTML = `
                    <img src="${fixImg(m.image_poster)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
                    <div class="anime-info">
                        <div class="anime-title" title="${m.title}">${m.title}</div>
                        <div class="anime-meta">
                            <span>⭐ ${m.rating || '-'}</span>
                            <span>👁️ ${m.views || 0}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function loadDetail(id, title) {
            document.getElementById('play-title').innerText = title;
            document.getElementById('player-section').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            document.getElementById('video-wrapper').innerHTML = '<div style="color:#aaa;">Pilih episode di bawah...</div>';
            document.getElementById('server-list-container').innerHTML = '';

            const data = await fetchAPI(`/api/episodes/${id}`);
            const epList = document.getElementById('ep-list');
            epList.innerHTML = '';

            if (data && data.episode) {
                const eps = data.episode.reverse(); 
                eps.forEach(ep => {
                    let btn = document.createElement('button');
                    btn.className = 'ep-btn';
                    btn.innerText = `Ep. ${ep.index}`;
                    btn.onclick = (e) => {
                        document.querySelectorAll('#ep-list .ep-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        playEpisode(ep.id, `${title} - Episode ${ep.index}`);
                    };
                    epList.appendChild(btn);
                });
            } else {
                epList.innerHTML = '<span style="color:#aaa;">Belum ada episode.</span>';
            }
        }

        async function playEpisode(epId, epTitle) {
            document.getElementById('play-title').innerText = epTitle;
            const videoContainer = document.getElementById('video-wrapper');
            const serverContainer = document.getElementById('server-list-container');
            
            videoContainer.innerHTML = '<div style="color:white;">Mencari sumber video... ⏳</div>';
            serverContainer.innerHTML = '';

            const data = await fetchAPI(`/api/stream/${epId}`);
            
            if (data && data.server && data.server.length > 0) {
                let serversHTML = '<div class="server-box">';
                serversHTML += '<div class="server-title">PILIH SERVER:</div>';
                serversHTML += '<div style="display:flex; flex-wrap:wrap; gap:8px;">';
                
                data.server.forEach((s, idx) => {
                    let typeLabel = s.type === 'iframe' || s.type === 'semi' ? ' (Iframe)' : ' (MP4)';
                    serversHTML += `<button class="ep-btn" onclick="switchServer('${s.link}', '${s.type}', this)">${s.name} ${s.quality}${typeLabel}</button>`;
                });
                serversHTML += '</div></div>';
                serverContainer.innerHTML = serversHTML;

                // Mengutamakan server 480p atau 720p sebagai standar keseimbangan kuota dan kualitas
                let bestServer = data.server.find(s => s.quality === '480p') || 
                                 data.server.find(s => s.quality === '720p') || 
                                 data.server[0];
                                 
                setTimeout(() => {
                    let btns = serverContainer.querySelectorAll('.ep-btn');
                    if(btns.length > 0) btns[data.server.indexOf(bestServer)].classList.add('active');
                }, 50);

                switchServer(bestServer.link, bestServer.type, null);
            } else {
                videoContainer.innerHTML = '<div style="color:red;">Gagal menemukan link video!</div>';
            }
        }

        // === FUNGSI PEMUTAR ANTI-CORS FINAL ===
        window.switchServer = function(link, type, btnElement) {
            if(btnElement) {
                document.querySelectorAll('#server-list-container .ep-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
            
            const videoContainer = document.getElementById('video-wrapper');
            
            // Trik Sakti: Apapun formatnya (.mp4, direct, iframe, embed), HAJAR PAKAI IFRAME!
            // Iframe menembus proteksi CORS dari Server Storage karena dihitung sebagai tab baru oleh browser.
            // Untuk link .mp4, Chrome Android akan otomatis menyulap iframe tersebut jadi Native Video Player.
            videoContainer.innerHTML = `<iframe src="${link}" allowfullscreen allow="autoplay; fullscreen" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>`;
        };

        loadHome();
    </script>
</body>
</html>
